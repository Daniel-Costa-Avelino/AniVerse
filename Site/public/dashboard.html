<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./style/reset.css">
    <link rel="stylesheet" href="./style/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header class="cabecalho_dashboard">
        <div class="div_perfilUsuario">
            <img src="./assets/avatar.png" alt="Imagem de avatar" class="imgAvatar">
            <p id="p_nomeUsuario"></p>
        </div>
        <div class="div_voltar">
            <img src="./assets/iconeVoltar.png" alt="Ícone de voltar">
            <a href="./perfil.html">Voltar para perfil</a>
        </div>
    </header>

    <section id="sessao_indicadores">
        <div id="card_ranking" class="card_indicadores">
            <p class="p_titulo_card">Ranking:</p>
            <p id="p_ranking" class="p_paragrafo_indicador"></p>
        </div>
        <div id="card_genero_mais_assistido" class="card_indicadores">
            <p class="p_titulo_card">Gênero mais assistido:</p>
            <p id="p_generoMaisAssistido" class="p_paragrafo_indicador"></p>
        </div>
        <div id="card_tempo_assistido" class="card_indicadores">
            <p class="p_titulo_card">Tempo assistido ao todo:</p>
            <p id="p_tempo_assistido" class="p_paragrafo_indicador"></p>
        </div>
    </section>

    <section class="sessao_graficos_menores">
        <div id="div_grafico_qtdAnimesPorGenero">
            <canvas id="grafico_qtd_animes_por_genero"></canvas>
        </div>
        <div id="div_grafico_qtdAnimes_assistidosAnoVigente">
            <canvas id="grafico_qtdAnimes_assistidosAnoVigente"></canvas>
        </div>
    </section>

    <section class="sessao_grafico_maior">
        <div id="div_grafico_horasAssistidasPorAnime">
            <canvas id="grafico_horas_assistidas_por_anime"></canvas>
        </div>
    </section>
</body>

</html>

<script src="./js/sessao.js"></script>
<script src="./js/graficoQtdAnimesAnoVigente.js"></script>
<script src="./js/graficoQtdAnimesPorGenero.js"></script>
<script src="./js/graficoQtdHorasPorAnime.js"></script>
<script>

    window.onload = validarSessao();
    window.onload = validarSessao_avatarDash();

    p_nomeUsuario.innerHTML = `
    <p id="p_nomeUsuario">Olá, ${sessionStorage.NOME_USUARIO}</p>
    `;

    window.onload = buscarRanking(), buscarGeneroMaisAssistido(), buscarTempoAssistido();

    function buscarRanking() {

        fetch("/dashboard/buscarRanking", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUserServer: sessionStorage.getItem("ID_USUARIO")
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.RANKING_USUARIO = json[0].ranking;

                    p_ranking.innerHTML = `
                        <p id="p_ranking" class="p_paragrafo_indicador">${json[0].ranking}º</p>
                    `;
                });
            } else {
                console.log("Houve um erro ao tentar buscar o ranking!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function buscarGeneroMaisAssistido() {

        fetch("/dashboard/buscarGeneroMaisAssistido", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUserServer: sessionStorage.getItem("ID_USUARIO")
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.GENERO_MAIS_ASSISTIDO = json[0].genero;

                    p_generoMaisAssistido.innerHTML = `
                        <p id="p_generoMaisAssistido" class="p_paragrafo_indicador">${json[0].genero}</p>
                    `;

                });
            } else {
                console.log("Houve um erro ao tentar buscar o genero mais assistido!");
                p_generoMaisAssistido.innerHTML = `
                        <p id="p_generoMaisAssistido" class="p_paragrafo_indicador">Nenhum anime adicionado</p>
                    `;
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function buscarTempoAssistido() {

        fetch("/dashboard/buscarTempoAssistido", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUserServer: sessionStorage.getItem("ID_USUARIO")
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.TEMPO_ASSISTIDO = json[0].qtdTempoAssistido;

                    if (json[0].qtdTempoAssistido != null) {
                        p_tempo_assistido.innerHTML = `
                        <p id="p_tempo_assistido" class="p_paragrafo_indicador">${json[0].qtdTempoAssistido} minutos</p>
                    `;
                    } else {
                        p_tempo_assistido.innerHTML = `
                        <p id="p_tempo_assistido" class="p_paragrafo_indicador">Nenhum anime adicionado</p>
                    `;
                    }
                });
            } else {
                console.log("Houve um erro ao tentar buscar os minutos assistidos!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
