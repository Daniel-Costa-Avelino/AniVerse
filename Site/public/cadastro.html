<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./style/reset.css">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/cadastro.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <div class="div_logo">
            <img src="./assets/logo.png" alt="Logo do site">
        </div>
        <div class="div_links">
            <a href="index.html" class="link">Home</a>
            <a href="historia.html" class="link">História do anime</a>
            <a href="desenvolvedor.html" class="link">Desenvolvedor</a>
        </div>
        <div class="div_login">
            <a href="./perfil.html" class="a_imgAvatarUsuario" hidden>
                <img src="./assets/avatar.png" alt="avatar usuario" width="100px" height="100px" class="imgAvatar">
            </a>
            <button class="btn_login" onclick="window.location.href = 'login.html'">Login</button>
        </div>
    </header>
    <!-- Fim do cabeçalho -->

    <section class="sessao_formulario">
        <div class="div_sessao_formulario">
            <div class="div_banner_login">
                <img src="./assets/bannerLogin.png" alt="Banner no Login">
            </div>
            <div class="div_formulario">
                <div class="div_titulo_login">
                    <h1>Cadastre-se!</h1>
                </div>
                <div class="div_campos_login">
                    <div class="div_campo">
                        <img src="./assets/iconeEmailLogin.png" alt="Ícone de E-mail">
                        <input type="text" placeholder="E-mail" id="input_email">
                    </div>
                    <div class="div_campo">
                        <img src="./assets/iconeUser.png" alt="Ícone de Username">
                        <input type="text" placeholder="Nome" id="input_username">
                    </div>
                    <div class="div_campo">
                        <img src="./assets/iconeSenha.png" alt="Ícone de senha">
                        <input type="password" placeholder="Senha" id="input_senha">
                    </div>
                    <div class="div_campo">
                        <img src="./assets/iconeSenha.png" alt="Ícone de senha">
                        <input type="password" placeholder="Confirmar senha" id="input_confirmarSenha">
                    </div>
                </div>
                <div class="div_login_entrar">
                    <button class="btn_entrar" onclick="validarCadastro()">Cadastrar</button>
                </div>
            </div>
        </div>
    </section>

    <section id="section_modal_mensagem">
        <div class="div_mensagem" id="div_mensagem">
        </div>
    </section>
    <script src="./js/sessao.js"></script>

</body>

</html>
<script>

    window.onload = validarSessao_avatar()
    window.onload = validarSessao_avatar_v2();
    
    function validarCadastro() {
        var emailVar = input_email.value
        var usernameVar = input_username.value
        var senhaVar = input_senha.value
        var confirmacaoSenhaVar = input_confirmarSenha.value

        if (
            usernameVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == ""
        ) {
            var mensagem = "Preencha todos os dados para efetuar o cadastro!"
            modalErro(mensagem);
            setInterval(fecharModalMensagem, 3000)
            return false;
        } else if (senhaVar != confirmacaoSenhaVar) {
            alert("As senhas estão diferentes!")
        } else if (
            !(emailVar.includes('@')) ||
            !(emailVar.includes('.com')) ||
            !(emailVar.includes('gmail'))
        ) {
            alert("O gmail deve conter: @, .com e gmail")
        } else {
            cadastrar(emailVar, usernameVar, senhaVar)
        }
    }

    function cadastrar(emailVar, usernameVar, senhaVar) {
        // Enviando o valor da nova input
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                usernameServer: usernameVar,
                emailServer: emailVar,
                senhaServer: senhaVar
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    var mensagem = "Cadastro realizado com sucesso, você irá para página de login...";
                    modalFuncionou(mensagem);
                    setInterval(fecharModalMensagem, 2500)

                    setTimeout(() => {
                        window.location = "login.html";
                    }, 3500);

                } else {
                    var mensagem = "Houve um erro ao tentar realizar o cadastro!";
                    modalErro(mensagem);
                    setInterval(fecharModalMensagem, 2500)
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }
</script>
