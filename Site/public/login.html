<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./style/reset.css">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/login.css">

</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <div class="div_logo">
            <img src="./assets/logo.png" alt="Logo do site">
        </div>
        <div class="div_links">
            <a href="index.html" class="link">Home</a>
            <a href="historia.html" class="link">História do anime</a>
            <a href="desenvolvedor.html" class="link">Desenvolvedor</a>
        </div>
        <div class="div_login">
            <a href="./perfil.html" class="a_imgAvatarUsuario" hidden>
                <img src="./assets/avatar.png" alt="avatar usuario" width="100px" height="100px" class="imgAvatar">
            </a>
            <button class="btn_login" onclick="window.location.href = 'login.html'">Login</button>
        </div>
    </header>
    <!-- Fim do cabeçalho -->

    <section class="sessao_formulario">
        <div class="div_sessao_formulario">
            <div class="div_banner_login">
                <img src="./assets/bannerLogin.png" alt="Banner no Login">
            </div>
            <div class="div_formulario">
                <div class="div_titulo_login">
                    <h1>Olá, que bom vê-lo novamente!</h1>
                    <img src="./assets/iconeCelebracao.png" alt="Ícone de celebração">
                </div>
                <div class="div_campos_login">
                    <div class="div_campo">
                        <img src="./assets/iconeEmailLogin.png" alt="Ícone de E-mail">
                        <input type="text" placeholder="E-mail" id="input_email">
                    </div>
                    <div class="div_campo">
                        <img src="./assets/iconeUser.png" alt="Ícone de Username">
                        <input type="text" placeholder="Nome" id="input_username">
                    </div>
                    <div class="div_campo">
                        <img src="./assets/iconeSenha.png" alt="Ícone de senha">
                        <input type="password" placeholder="Senha" id="input_senha">
                    </div>
                </div>
                <div class="div_login_entrar">
                    <button class="btn_entrar" onclick="entrar()">Entrar</button>
                    <p>Não possui uma conta? <a href="./cadastro.html">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </section>

    <section id="section_modal_mensagem">
        <div class="div_mensagem" id="div_mensagem">
        </div>
    </section>
    <script src="./js/sessao.js"></script>
</body>

</html>
<script>
    window.onload = validarSessao_avatar()
    window.onload = validarSessao_avatar_v2();

    function entrar() {

        var usernameVar = input_username.value;
        var emailVar = input_email.value;
        var senhaVar = input_senha.value;

        if (emailVar == "" || senhaVar == "" || usernameVar == "") {
            var mensagem = "Preencha todos os dados para efetuar o Login!"
            modalErro(mensagem);
            setInterval(fecharModalMensagem, 3000)
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usernameServer: usernameVar,
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);
                var mensagem = "Login realizado com sucesso! Você irá para página de perfil.";
                modalFuncionou(mensagem);
                setInterval(fecharModalMensagem, 2500)

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NOME_USUARIO = json.username;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.IDADE_USUARIO = json.idade;
                    sessionStorage.GENERO_USUARIO = json.generoUsuario;
                    setInterval(function () {
                        window.location = "perfil.html";
                    }, 3500);
                });
            } else {
                var mensagem = "Houve um erro ao logar, verifique suas credenciais!";
                console.log("Houve um erro ao tentar realizar o login!");

                modalErro(mensagem);
                setInterval(fecharModalMensagem, 2500)

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

</script>
